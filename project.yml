# XcodeGen project definition. Generate the Xcode project with:
#   brew install xcodegen && xcodegen generate
# (CI does this automatically, see .github/workflows/build.yml)
name: KiPad
options:
  bundleIdPrefix: com.hitaf001
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
    GCC_ENABLE_CPP_EXCEPTIONS: YES
    GCC_ENABLE_CPP_RTTI: YES
    ENABLE_BITCODE: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  KiPad:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: core/src
      - path: core/include
      - path: samples
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: KiPad
        PRODUCT_BUNDLE_IDENTIFIER: com.hitaf001.kipad
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: Support/KiPad-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/core/include $(SRCROOT)/core/src"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
      configs:
        Release:
          GCC_OPTIMIZATION_LEVEL: "3"
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: KiPad
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.kicad.pcb
            UTTypeDescription: KiCad PCB
            UTTypeConformsTo:
              - public.data
              - public.content
            UTTypeTagSpecification:
              public.filename-extension:
                - kicad_pcb
        CFBundleDocumentTypes:
          - CFBundleTypeName: KiCad PCB
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.kicad.pcb
